AWSTemplateFormatVersion: 2010-09-09
Description: >-
  API for email SQS queue

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      bucket: emails-service-storage
      certificate: adce1a21-90b4-4120-8548-111215e582f0
      domain: emails-queue-api.dbowland.com
      logStreamFunction: log-subscriber
      queueNameBounce: emails-to-bounce.fifo
      queueNameSend: emails-to-send.fifo
      zoneId: Z072422417XWM8PIXXSFA
    test:
      bucket: emails-service-storage-test
      certificate: 6a48cba7-feb9-4de5-8cbf-d383140fcdef
      domain: emails-queue-api.bowland.link
      logStreamFunction: log-subscriber-test
      queueNameBounce: emails-to-bounce-test.fifo
      queueNameSend: emails-to-send-test.fifo
      zoneId: Z01312547RGU1BYKIJXY

Resources:
  # API Gateway

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Auth:
        ApiKeyRequired: true # sets for all methods
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Usage plan for emails-queue-api
      Domain:
        DomainName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        CertificateArn: !Sub
          - 'arn:aws:acm:${AWS::Region}:${AWS::AccountId}:certificate/${Certificate}'
          - Certificate: !FindInMap [EnvironmentMap, !Ref Environment, certificate]
        EndpointConfiguration: EDGE
        Route53:
          HostedZoneId: !FindInMap [EnvironmentMap, !Ref Environment, zoneId]
        BasePath:
          - /v1
      # Without this the gateway makes no sampling decision and passes no tracing header on invoke,
      # so these Lambdas root a NEW trace instead of continuing the caller's — and the callers that
      # bother to send X-Amzn-Trace-Id (bridge-api's tracedFetch, emails-inbound-service's captured
      # https) get a header that lands in event.headers and is read by nobody. This stage is only
      # two endpoints, both low volume, so the gateway segments it mints are cheap. Do NOT copy this
      # to emails-email-api: that stage fronts 22 endpoints, most of them the UI's, and tracing it
      # would undo the per-function split there. See playhouse
      # docs/superpowers/specs/2026-08-03-xray-removal-design.md.
      TracingEnabled: true

  # Send email

  PostEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/post-email.postEmailHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Adds emails to the queue to be sent
      Policies:
        # Give Lambda basic execution Permission
        - AWSLambdaBasicExecutionRole
        # Grant access to S3 bucket
        - S3WritePolicy:
            BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
        # Access to tag objects in S3
        - Version: 2012-10-17
          Statement:
            - Action: 's3:PutObjectTagging'
              Effect: Allow
              Resource: !Sub
                - 'arn:aws:s3:::${BucketName}/*'
                - BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
        # Grant access to SQS queue
        - SQSSendMessagePolicy:
            QueueName: !FindInMap [EnvironmentMap, !Ref Environment, queueNameSend]
      Environment:
        Variables:
          EMAIL_BUCKET: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
          EMAIL_REGION: us-east-1
          ENVIRONMENT: !Ref Environment
          SQS_MESSAGE_QUEUE_ID: emails
          SQS_QUEUE_URL: !Sub
            - 'https://sqs.us-east-1.amazonaws.com/${AWS::AccountId}/${Queue}'
            - Queue: !FindInMap [EnvironmentMap, !Ref Environment, queueNameSend]
      Events:
        ApiKey:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /emails
            Method: post
            Auth:
              ApiKeyRequired: true
      Tags:
        'created-by': 'emails-queue-api'
        'created-for': 'emails'
        'environment': !Ref Environment
      Timeout: 15
      Tracing: Active
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/post-email.ts

  PostEmailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PostEmailFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-api'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  # PostEmailLogGroup is deliberately not subscribed to log-subscriber. log-subscriber sends its
  # alerts through POST /v1/emails, so a subscription here would make every failure of that call
  # log an ERROR that invokes log-subscriber, which calls this endpoint again. The bounce path
  # below is not on log-subscriber's send path and stays subscribed.

  # Send bounce

  PostBounceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/post-bounce.postBounceHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1024
      Description: Adds bounces to the queue to be sent
      Policies:
        # Give Lambda basic execution Permission
        - AWSLambdaBasicExecutionRole
        # Grant access to S3 bucket
        - S3WritePolicy:
            BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
        # Access to tag objects in S3
        - Version: 2012-10-17
          Statement:
            - Action: 's3:PutObjectTagging'
              Effect: Allow
              Resource: !Sub
                - 'arn:aws:s3:::${BucketName}/*'
                - BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
        # Grant access to SQS queue
        - SQSSendMessagePolicy:
            QueueName: !FindInMap [EnvironmentMap, !Ref Environment, queueNameBounce]
      Environment:
        Variables:
          EMAIL_BUCKET: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
          EMAIL_REGION: us-east-1
          ENVIRONMENT: !Ref Environment
          SQS_MESSAGE_QUEUE_ID: bounces
          SQS_QUEUE_URL: !Sub
            - 'https://sqs.us-east-1.amazonaws.com/${AWS::AccountId}/${Queue}'
            - Queue: !FindInMap [EnvironmentMap, !Ref Environment, queueNameBounce]
      Events:
        ApiKey:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /bounces
            Method: post
            Auth:
              ApiKeyRequired: true
      Tags:
        'created-by': 'emails-queue-api'
        'created-for': 'emails'
        'environment': !Ref Environment
      Timeout: 15
      Tracing: Active
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/post-bounce.ts

  PostBounceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PostBounceFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-api'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  PostBounceLogGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref PostBounceLogGroup
